    <title>Tailwind CSS Demo</title>
    <link rel="stylesheet" href="style.css">
<body>
    <div class="mt-20 mx-52 flex flex-wrap rounded-lg border-2 border-black">
        <!-- quote -->
       <div class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white h-24 flex justify-center items-center font-bold text-xl rounded">
        News you can Trust 
    </div>
    <!-- content -->
    <div class="w-full text-center mt-6 ">
        <h3 class="text-lg font-semibold">Stay Up-to-date with the Latest!</h3>
        <p>Subscribe to our newsletter for the latest news straight into your
            inbox.
        </p>
        <form class="flex flex-wrap">
            <input placeholder="youremail@gmail.com" class="w-full text-center bg-slate-200 placeholder:text-sm my-4 py-2 mx-52">
            <button class="bg-purple-500 w-full text-white mx-52 py-2 rounded-full transition">Subscribe Now</button>
            <p class="mt-6  text-center w-full text-sm">We value your privacy</p>
        </form>
    </div>
